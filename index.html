<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RI Calculator</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family: Arial;
  max-width:700px;
  margin:auto;
  padding:20px;
  background:#f4f4f4;
}

input,select,button{
  width:100%;
  padding:8px;
  margin:5px 0 15px 0;
  font-size:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  margin-bottom:20px;
}

th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}

th{background:#eee;}

canvas{
  background:white;
  padding:10px;
}
</style>
</head>

<body>

<h2>Relative Intensity Calculator</h2>

<!-- ATHLETE -->
<h3>Athlet</h3>
<select id="athleteSelect"></select>
<input id="newAthlete" placeholder="Neuer Athlet">
<button onclick="addAthlete()">Athlet hinzufügen</button>

<!-- EXERCISE -->
<h3>Übung</h3>
<select id="exerciseSelect"></select>
<input id="newExercise" placeholder="Neue Übung">
<button onclick="addExercise()">Übung speichern</button>

<!-- RM OVERVIEW -->
<h3>RM Übersicht</h3>
<table>
<thead>
<tr>
<th>1RM</th>
<th>2RM</th>
<th>3RM</th>
<th>5RM</th>
</tr>
</thead>
<tbody>
<tr>
<td id="rm1">-</td>
<td id="rm2">-</td>
<td id="rm3">-</td>
<td id="rm5">-</td>
</tr>
</tbody>
</table>

<!-- INPUT -->
<label>Getestetes Gewicht (kg)</label>
<input id="rmWeight" type="number" value="100">

<label>Test RM (1–10)</label>
<input id="testRM" type="number" min="1" max="10" value="3">

<label>Relative Intensität</label>
<select id="intensity">
<option value="80">80%</option>
<option value="82.5">82.5%</option>
<option value="85">85%</option>
<option value="87.5">87.5%</option>
<option value="90">90%</option>
<option value="92.5">92.5%</option>
</select>

<label>Rundung</label>
<select id="roundStep">
<option value="0.005">0,5 %</option>
<option value="0.025" selected>2,5 %</option>
</select>

<!-- RESULT TABLE -->
<table>
<thead>
<tr>
<th>Reps</th>
<th>%</th>
<th>Gewicht</th>
</tr>
</thead>
<tbody id="resultTable"></tbody>
</table>

<!-- GRAPH -->
<h3>Progress Graph</h3>
<canvas id="progressChart"></canvas>

<!-- HISTORY -->
<h3>Progress History</h3>
<table>
<thead>
<tr>
<th>Datum</th>
<th>Athlet</th>
<th>Übung</th>
<th>RM</th>
<th>Gewicht</th>
</tr>
</thead>
<tbody id="historyTable"></tbody>
</table>

<script src="app.js"></script>

</body>
</html>

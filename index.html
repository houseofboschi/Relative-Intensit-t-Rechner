<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM Calculator</title>

<link rel="manifest" href="manifest.json">

<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  padding:20px;
  max-width:700px;
  margin:auto;
}

input,select,button{
  padding:8px;
  margin:5px 0;
  width:100%;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

td,th{
  border:1px solid #444;
  padding:8px;
  text-align:center;
}

.pr-table input{
  width:80px;
  text-align:center;
}
</style>
</head>

<body>

<h2>🏋️ RM Calculator</h2>

<!-- Übung speichern -->
<h3>Übung</h3>

<input id="exerciseName" placeholder="Neue Übung eingeben">
<button onclick="saveExercise()">Übung speichern</button>

<select id="exerciseSelect"></select>

<hr>

<!-- PR Tabelle -->
<h3>PR Werte</h3>

<table class="pr-table">
<thead>
<tr>
<th>1RM</th>
<th>2RM</th>
<th>3RM</th>
<th>5RM</th>
</tr>
</thead>

<tbody>
<tr>
<td><input id="rm1"></td>
<td><input id="rm2"></td>
<td><input id="rm3"></td>
<td><input id="rm5"></td>
</tr>
</tbody>
</table>

<hr>

<h3>Berechnung</h3>

<label>Gewicht (Test RM)</label>
<input id="rmWeight" type="number">

<label>Test RM</label>
<select id="testRM">
<option value="1">1RM</option>
<option value="2">2RM</option>
<option value="3">3RM</option>
<option value="5">5RM</option>
</select>

<label>Relative Intensität</label>
<select id="intensity">
<option>80</option>
<option>82.5</option>
<option>85</option>
<option>87.5</option>
<option>90</option>
<option>92.5</option>
</select>

<label>Rundung</label>
<select id="roundStep">
<option value="0.5">0.5 kg</option>
<option value="1">1 kg</option>
<option value="2.5">2.5 kg</option>
</select>

<table>
<thead>
<tr>
<th>Reps</th>
<th>%</th>
<th>Gewicht</th>
</tr>
</thead>

<tbody id="resultTable"></tbody>
</table>

<script src="app.js"></script>

</body>
</html>

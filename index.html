<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RI Calculator</title>

<style>
body{
  font-family: Arial;
  max-width:700px;
  margin:auto;
  padding:20px;
  background:#f4f4f4;
}

input, select, button{
  width:100%;
  padding:8px;
  margin:5px 0 15px 0;
  font-size:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  margin-top:15px;
}

th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}

th{background:#eee;}
</style>
</head>

<body>

<h2>Relative Intensity Calculator</h2>

<label>Athlet</label>
<input id="athleteName" placeholder="Name eingeben">

<label>Übung</label>
<input id="exerciseName" placeholder="z.B. Hang Power Clean">

<label>PR Gewicht (kg)</label>
<input id="prValue" type="number">

<button id="savePR">PR speichern</button>

<h3>Leaderboard</h3>

<table>
<thead>
<tr>
<th>Athlet</th>
<th>Übung</th>
<th>PR</th>
</tr>
</thead>

<tbody id="leaderboardBody"></tbody>
</table>

<!-- APP -->
<script type="module" src="app.js"></script>

</body>
</html>

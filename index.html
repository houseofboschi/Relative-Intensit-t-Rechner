<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Workout App</title>
</head>

<body>

<h1>Meine Workouts</h1>

<button onclick="loadWorkouts()">Workouts laden</button>

<ul id="workoutList"></ul>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// 🔥 DEINE FIREBASE CONFIG HIER EINSETZEN
const firebaseConfig = {
  apiKey: "DEIN_API_KEY",
  authDomain: "DEIN_PROJECT.firebaseapp.com",
  projectId: "DEIN_PROJECT_ID",
  storageBucket: "DEIN_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


// ✅ WORKOUTS LADEN
async function loadWorkouts() {

  console.log("Lade Workouts...");

  const list = document.getElementById("workoutList");
  list.innerHTML = "";

  try {

    const querySnapshot = await getDocs(collection(db, "Workouts"));

    console.log("Dokumente gefunden:", querySnapshot.size);

    querySnapshot.forEach((doc) => {

      console.log(doc.data());

      const li = document.createElement("li");
      li.textContent = doc.data().name;

      list.appendChild(li);
    });

  } catch (error) {
    console.error("Fehler:", error);
  }
}

// GLOBAL verfügbar machen (für Button)
window.loadWorkouts = loadWorkouts;

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RI Coach App</title>

<style>
body{
  font-family:Arial;
  max-width:520px;
  margin:auto;
  padding:20px;
  background:#f4f4f4;
}

input,select,button{
  width:100%;
  padding:8px;
  margin:5px 0 15px 0;
  font-size:16px;
}

button{
  background:#222;
  color:white;
  border:none;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
</style>
</head>

<body>

<h2>RI Coach App</h2>

<!-- ATHLETE -->
<label>Athlet</label>
<input id="athleteName" placeholder="Athlet Name">

<button onclick="saveAthlete()">Athlet speichern</button>

<select id="athleteSelect"></select>

<!-- EXERCISE -->
<label>Übung</label>
<input id="exerciseName" placeholder="Übung">

<button onclick="saveExercise()">Übung speichern</button>

<select id="exerciseSelect"></select>

<!-- PR INPUTS -->
<h3>PR Werte</h3>

<label>1RM</label>
<input id="rm1" type="number">

<label>2RM</label>
<input id="rm2" type="number">

<label>3RM</label>
<input id="rm3" type="number">

<label>5RM</label>
<input id="rm5" type="number">

<button onclick="savePR()">PR speichern</button>

<hr>

<label>Relative Intensität</label>
<select id="intensity">
  <option value="80">80%</option>
  <option value="82.5">82,5%</option>
  <option value="85" selected>85%</option>
  <option value="87.5">87,5%</option>
  <option value="90">90%</option>
  <option value="92.5">92,5%</option>
</select>

<table>
<thead>
<tr>
<th>Reps</th>
<th>%</th>
<th>Gewicht</th>
</tr>
</thead>
<tbody id="resultTable"></tbody>
</table>

<script src="app.js"></script>

</body>
</html>

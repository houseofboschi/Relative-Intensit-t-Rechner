<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Workout App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #00ffcc;
    }

    #workoutContainer {
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
      background: #222;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .exercise {
      background: #333;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #00ffcc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🏋️ Workout App</h1>

  <!-- Button zum Laden -->
  <button onclick="loadWorkout()">Workout laden</button>

  <!-- Ausgabe -->
  <div id="workoutContainer">
    <h2 id="title">Kein Workout geladen</h2>
    <div id="exercises"></div>
  </div>

  <!-- Firebase -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // 🔥 HIER DEINE FIREBASE DATEN EINFÜGEN
    const firebaseConfig = {
      apiKey: "DEIN_API_KEY",
      authDomain: "DEIN_PROJECT.firebaseapp.com",
      projectId: "DEIN_PROJECT_ID",
      storageBucket: "DEIN_PROJECT.appspot.com",
      messagingSenderId: "XXXX",
      appId: "XXXX"
    };

    // Firebase starten
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    // =========================
    // WORKOUT LADEN
    // =========================
    window.loadWorkout = async function () {

      console.log("Lade Workout...");

      try {
        // WICHTIG:
        // Collection = Workouts (groß!)
        // Document = workout_001
        const docRef = doc(db, "Workouts", "workout_001");

        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {

          const data = docSnap.data();
          console.log(data);

          // Titel anzeigen
          document.getElementById("title").innerText = data.title;

          const exercisesDiv = document.getElementById("exercises");
          exercisesDiv.innerHTML = "";

          // Übungen anzeigen
          data.parts.forEach(part => {

            const div = document.createElement("div");
            div.className = "exercise";

            div.innerHTML = `
              <strong>${part.exercise}</strong><br>
              Sätze: ${part.sets}<br>
              Wiederholungen: ${part.reps}<br>
              Intensität: ${part.intensity}
            `;

            exercisesDiv.appendChild(div);
          });

        } else {
          alert("Workout nicht gefunden!");
        }

      } catch (error) {
        console.error("Fehler:", error);
        alert("Fehler beim Laden — siehe Konsole");
      }
    };

  </script>

</body>
</html>
